baseURL: "https://abduldavids.co.za/"
title: Abdul Baari Davids
pagination:
  pagerSize: 50
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Abdul Baari Davids
  description: "Abdul Baari Davids personal blog and portfolio."
  keywords: [Blog, Portfolio, Developer]
  author: Abdul Baari Davids
  # author: ["Me", "You"] # multiple authors
  social:
    twitter: abdulbdavids # twitter:site handle on social cards
  DateFormat: "January 2, 2006"
  defaultTheme: auto # auto follows device, or dark, light
  disableThemeToggle: false

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  label:
    text: "Abdul Davids"

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Abdul Baari Davids
    subtitle: "Applied AI Engineer | Technical Writer"
    imageUrl: "/ProfilePic.jpg"
    imageWidth: 96
    imageHeight: 96
    imageTitle: Abdul Baari Davids

  # home-info mode
  homeInfoParams:
    Title: "Hi there, my name is Abdul Baari \U0001F44B"
    Content: Welcome to my blog

  socialIcons:
    - name: x
      url: "https://twitter.com/abdulbdavids"
    - name: github
      url: "https://github.com/AbdulDavids"
    - name: linkedin
      url: "https://www.linkedin.com/in/abduldavids/"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/AbdulDavids/blog/tree/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: About
      name: About
      url: /About/
      weight: 30
    - identifier: Posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: Projects
      name: Projects
      url: /projects/
      weight: 20
    - identifier: Resume
      name: Resume
      url: https://docs.google.com/document/d/19UK7K5UlrhqD3JFsvAFf6Hc8tTJZOgvVmnj0lzyC7Zo/edit?usp=sharing
      weight: 40
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    anchorLineNos: false
    # codeFences: true
    guessSyntax: true
    lineNos: true
    # style: monokai
